name: CI Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        run: bun run build

      - name: Create Release Archive
        run: |
          zip -r dgx-spark-status.zip build package.json server.js Makefile

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: dgx-spark-status
          path: dgx-spark-status.zip

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate version tag using date, time, and run number
          # e.g., v2026.06.08-run42
          TAG_NAME="v$(date +'%Y.%m.%d')-run${{ github.run_number }}"
          RELEASE_NAME="Release v$(date +'%Y.%m.%d') - Run ${{ github.run_number }}"
          
          echo "Creating release $RELEASE_NAME with tag $TAG_NAME"
          
          gh release create "$TAG_NAME" \
            dgx-spark-status.zip \
            --title "$RELEASE_NAME" \
            --generate-notes \
            --target master
