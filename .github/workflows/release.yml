name: Create Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Create Release Archive
        run: |
          zip -r dgx-spark-status.zip . -x "node_modules/*" -x ".git/*" -x ".github/*" -x ".svelte-kit/*"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate version tag using date, time, and run number
          # e.g., v2026.06.08-run42
          TAG_NAME="v$(date +'%Y.%m.%d')-run${{ github.run_number }}"
          RELEASE_NAME="Release v$(date +'%Y.%m.%d') - Run ${{ github.run_number }}"
          
          echo "Creating release $RELEASE_NAME with tag $TAG_NAME"
          
          gh release create "$TAG_NAME" \
            dgx-spark-status.zip \
            --title "$RELEASE_NAME" \
            --notes "Automated release build for commit ${{ github.sha }}." \
            --target master
